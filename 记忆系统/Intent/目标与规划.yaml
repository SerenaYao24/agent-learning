# 规划
plans:
  - name: 重塑信息渠道
    for_which_goal:
      - name: 成为一个智慧的人
      - name: 具备长远视角
      - name: 具备历史视角
    reason: 戒断或大幅减少高多巴胺、算法投喂的短平快信息。遇到重大技术突破时，强迫自己去寻找“源头信息”和“长程分析”。
    action: 日常只看关注，周末去找更源头的信息而不依赖推荐，比如 github、AI 社区，更多去阅读文字而不是去看视频
  - name: 刻意练习“强制类比”和抽象能力
    for_which_goal:
      - name: 成为一个智慧的人
      - name: 具备历史视角
    reason: 大脑不会自动进行跨界联想，你需要给它设置“触发器”，通过刻意的提问增加链接
    action: 每当遇到一个被广泛讨论的新现象，强迫写下它与历史上/其他哪三个事件最相似，写下它们最核心的差异点。比如“AI 像蒸汽机，但蒸汽机替代的是体力，AI 替代的是认知”。找相似能建立宏观视野，找差异才能看清事物本质。
  - name: 建立并维护“思维模型库”
    for_which_goal:
      - name: 成为一个智慧的人
      - name: 具备长远视角
      - name: 具备历史视角
    reason: 有意识地跨学科阅读，收集并总结思维模型。比如演化生物学的“物竞天择”、经济学的“边际成本递减”、复杂系统的“涌现”、物理学的“熵增
    action: 写下它在你日常工作或生活中的三个具体应用场景
  - name: 坚持写作
    for_which_goal:
      - name: 成为一个智慧的人
      - name: 具备长远视角
      - name: 具备历史视角
    reason: 只是在脑子里想一想，思想是会溜走的，且容易陷入逻辑自洽的幻觉。写作是启动大脑“系统2（深度思考）”最好的强制手段，它会逼迫你跳出表面的狂热，去寻找事物底层的骨架。
    action: 每月写一篇超过两千字的深度洞察文章，信息，或者做一次深入的复盘笔记。不要写情绪化的口水话，要求必须在文章中引用至少一个历史事件或经济学概念来佐证你的观点。
  - name: 追问
    for_which_goal:
      - name: 成为一个智慧的人
      - name: 具备长远视角
      - name: 具备历史视角
    reason: 不满足于“发生了什么”，而是追问“为什么这个变化能成立”。
    action: 凡事往前追问，一直往下问，直到触碰到不可辩驳的物理学定律、基础经济学原理或人性底色为止
  - name: 趋势识别
    for_which_goal:
      - name: 成为一个智慧的人
      - name: 具备长远视角
      - name: 具备历史视角
    reason: 真正的大变化，通常都不是新闻触发的，而是长期变量积累到临界点。
    action: 观察长期约束变量
  - name: 制作付费 ios app
    for_which_goal:
      - name: 通过产品赚到第一笔非工资收入
    reason: 移动端 IOS App 付费是成熟变现路径，只需要做出有人愿意付费的产品
    action:
      - 发现一个有趣的需求，并将其转化为产品
      - 制作一个 MVP 原型
      - 通过 App Store 上架



